<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trình tạo CV chuyên nghiệp</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Lora:wght@400;600;700&family=Inter:wght@400;600;700&display=swap">
<style>
:root{--bg:#f3f4f6;--pn:#fff;--tx:#111827;--mu:#6b7280;--bd:#e5e7eb;--br:#0f766e;--brt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--pn:#1a1d23;--tx:#e5e7eb;--mu:#9ca3af;--bd:#2d323b;--br:#2dd4bf;--brt:#042f2e}}
:root[data-theme="dark"]{--bg:#0f1115;--pn:#1a1d23;--tx:#e5e7eb;--mu:#9ca3af;--bd:#2d323b;--br:#2dd4bf;--brt:#042f2e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Be Vietnam Pro",Arial,sans-serif}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--pn);border-bottom:1px solid var(--bd)}
.top h1{font-size:16px;margin:0 auto 0 0}
button,select,input,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--bd);background:var(--pn);border-radius:8px;padding:6px 11px;cursor:pointer}
.btn:hover{border-color:var(--br)}.btn.p{background:var(--br);color:var(--brt);border-color:var(--br);font-weight:600}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--br);outline-offset:1px}
.app{display:grid;grid-template-columns:minmax(340px,430px) 1fr;gap:0;align-items:start}
.ui{border-right:1px solid var(--bd);background:var(--pn);min-height:calc(100vh - 56px)}
.tabs{display:flex;border-bottom:1px solid var(--bd);position:sticky;top:calc(env(safe-area-inset-top,0px) + 55px);background:var(--pn);z-index:4}
.tabs button{flex:1;padding:10px 4px;border:0;background:none;cursor:pointer;color:var(--mu);border-bottom:2px solid transparent}
.tabs button.on{color:var(--tx);font-weight:600;border-color:var(--br)}
.pane{padding:14px}
.f{display:grid;gap:8px}.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,textarea,select{width:100%;padding:7px 9px;border:1px solid var(--bd);border-radius:7px;background:var(--bg)}
textarea{resize:vertical;min-height:70px}
.card{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px}
.hd{display:flex;gap:6px;align-items:center;margin-bottom:8px}.hd input{font-weight:600}
.sm{padding:3px 8px;font-size:12px}
.sub{border-top:1px dashed var(--bd);padding-top:8px;margin-top:8px}
h3{font-size:13px;margin:14px 0 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{text-align:left;border:1px solid var(--bd);background:var(--bg);border-radius:9px;padding:9px;cursor:pointer}
.opt.on{border-color:var(--br);box-shadow:0 0 0 1px var(--br)}.opt b{display:block}.opt small{color:var(--mu)}
.sw{display:flex;flex-wrap:wrap;gap:7px}.sw button{width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);cursor:pointer}.sw button.on{border-color:var(--tx)}
.ck{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.score{font-size:30px;font-weight:700}
.stage{padding:16px;overflow:auto;height:calc(100vh - 56px);position:sticky;top:56px}
#paper{width:794px;margin:0 auto;box-shadow:0 2px 14px rgba(0,0,0,.22);transform-origin:top center}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:9px;max-width:90vw;z-index:9;display:none}
/* CV */
.cv{background:#fff;color:#1f2937;width:794px;min-height:1123px;padding:48px 52px;font:var(--fs)/var(--lh) var(--ff);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cv h1{font-size:2.1em;margin:0;line-height:1.15;color:#111}
.cv .ti{font-size:1.1em;color:var(--ac);margin-top:4px;font-weight:600}
.cv .ct{margin-top:8px;font-size:.92em;color:#4b5563}
.cv section{margin-top:calc(var(--gap)*1px)}
.cv h2{font-size:1.05em;margin:0 0 6px;font-weight:700;color:#111}
.cv p{margin:0}.cv ul{margin:4px 0 0;padding-left:18px}.cv li{margin:1px 0}
.cv .it{margin-bottom:9px}.cv .r{display:flex;justify-content:space-between;gap:12px}
.cv .r span{color:#6b7280;white-space:nowrap;font-size:.92em}.cv .o{color:#4b5563}
.cv.classic header{text-align:center}.cv.classic h2{border-bottom:1.5px solid var(--ac);padding-bottom:3px}
.cv.banner header{background:var(--ac);margin:-48px -52px 0;padding:38px 52px}
.cv.banner h1,.cv.banner .ti,.cv.banner .ct{color:#fff}.cv.banner h2{color:var(--ac);border-bottom:1px solid #e5e7eb;padding-bottom:3px}
.cv.minimal h2{color:var(--ac);border-left:3px solid var(--ac);padding-left:8px}
.cv.sidebar{display:grid;grid-template-columns:230px 1fr;padding:0}
.cv.sidebar aside{background:var(--ac);color:#fff;padding:44px 22px}
.cv.sidebar aside h2,.cv.sidebar aside .o,.cv.sidebar aside .r span{color:#fff}
.cv.sidebar aside h2{border-bottom:1px solid rgba(255,255,255,.45);padding-bottom:3px}
.cv.sidebar aside .ct{color:#fff;display:grid;gap:3px;word-break:break-word}
.cv.sidebar aside .r{display:block}
.cv.sidebar main{padding:46px 36px}
@media (max-width:860px){.app{grid-template-columns:1fr}.ui{min-height:0;border-right:0}.stage{height:auto;position:static}.tabs{top:calc(env(safe-area-inset-top,0px) + 55px)}}
@media print{.top,.ui,.toast{display:none!important}body,.stage{background:#fff;padding:0!important;height:auto!important;overflow:visible!important;position:static!important}.app{display:block}#paper{zoom:1!important;box-shadow:none!important;margin:0}@page{size:A4;margin:0}}
#paper{position:relative}
#paper::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0 1122px,rgba(220,38,38,.55) 1122px 1124px)}
.cv{--u:4px;padding:calc(var(--u)*12) calc(var(--u)*13);line-height:1.5}
.cv h1{font-size:1.95em;line-height:1.15;letter-spacing:-.01em}
.cv .ti{font-size:1.25em;line-height:1.3;margin-top:var(--u)}
.cv .ct{font-size:.875em;margin-top:calc(var(--u)*3)}
.cv h2{font-size:1.125em;line-height:1.3;margin:0 0 calc(var(--u)*2.5);break-after:avoid}
.cv p{orphans:2;widows:2}.cv ul{margin:var(--u) 0 0;padding-left:1.2em}.cv .o{font-weight:600}
.cv .it{display:grid;grid-template-columns:7.5em 1fr;column-gap:calc(var(--u)*4);margin-bottom:calc(var(--u)*3);break-inside:avoid}
.cv .it .t{grid-column:1;grid-row:1;color:#6b7280;font-size:.875em;line-height:1.7}
.cv .it .m{grid-column:2;grid-row:1;min-width:0}
.cv header.hp{display:flex;justify-content:space-between;align-items:center;gap:calc(var(--u)*6)}
.cv.classic header.hp{text-align:left}
.cv .ph{width:105px;height:140px;object-fit:cover;border-radius:4px;flex:none}
.cv.banner .ph{border:2px solid #fff}
.cv.sidebar aside .it{display:flex;flex-direction:column}
.cv.sidebar aside .t{order:-1;color:#fff;opacity:.85}
.cv.sidebar aside .ph{display:block;width:150px;height:200px;margin:0 auto calc(var(--u)*5)}
@media print{@page{size:A4;margin:12mm 0}.cv{padding-top:0;padding-bottom:0;min-height:0}.cv.banner header{margin-top:0}.cv.sidebar{min-height:0}#paper::after{display:none}}
</style>
</head>
<body>
<div class="top">
  <h1>Trình tạo CV</h1>
  <button class="btn p" data-x="pdf">Tải PDF</button>
  <button class="btn" data-x="docx">Word (.docx)</button><button class="btn" data-x="html">HTML</button>
  <button class="btn" data-x="txt" title="Bản văn bản thuần để dán vào ô nhập trên web tuyển dụng">Văn bản thuần</button>
  <button class="btn" data-x="json">Lưu dữ liệu</button>
  <label class="btn">Mở dữ liệu<input type="file" id="imp" accept=".json" hidden></label>
</div>
<div class="app">
  <div class="ui">
    <div class="tabs" id="tabs"></div>
    <div class="pane" id="pane"></div>
  </div>
  <div class="stage" id="stage"><div id="paper"></div></div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const FF={bevn:["Be Vietnam Pro","'Be Vietnam Pro',Arial,sans-serif"],lora:["Lora (có chân)","Lora,Georgia,serif"],inter:["Inter","Inter,Arial,sans-serif"],arial:["Arial (an toàn nhất)","Arial,Helvetica,sans-serif"]};
const TPL={classic:["Cổ điển","Một cột, tiêu đề căn giữa",1],minimal:["Tối giản","Một cột, tiêu đề gạch bên",1],banner:["Hiện đại","Một cột, đầu trang màu",1],sidebar:["Hai cột","Cột bên màu, đẹp mắt, ATS kém hơn",0]};
const COL=["#0f766e","#1d4ed8","#1e293b","#7c3aed","#be185d","#b45309","#15803d","#374151"];
const IND={
biz:{n:"Kinh doanh – Marketing",t:"banner",ac:"#1d4ed8",ff:"bevn",title:"Chuyên viên Marketing",sum:"4 năm kinh nghiệm xây dựng chiến dịch đa kênh cho ngành bán lẻ và thương mại điện tử. Thành thạo phân tích dữ liệu, tối ưu chi phí quảng cáo và dẫn dắt đội nội dung.",role:"Chuyên viên Marketing",org:"Công ty TNHH Thương mại ABC",time:"03/2022 – nay",d:"- Tăng doanh thu online 45% trong 12 tháng nhờ tối ưu phễu chuyển đổi\n- Giảm CPA 28% bằng thử nghiệm A/B trên 30 mẫu quảng cáo\n- Quản lý ngân sách quảng cáo 500 triệu đồng/tháng",sk:"Google Ads, Meta Ads, SEO, Google Analytics, Content Marketing, Excel, Quản lý dự án"},
it:{n:"Công nghệ thông tin",t:"minimal",ac:"#0f766e",ff:"inter",title:"Backend Developer",sum:"Lập trình viên backend 3 năm kinh nghiệm xây dựng API và hệ thống xử lý dữ liệu quy mô lớn. Quan tâm đến chất lượng mã nguồn, kiểm thử tự động và hiệu năng.",role:"Backend Developer",org:"Công ty Phần mềm XYZ",time:"06/2022 – nay",d:"- Thiết kế 25 REST API phục vụ 200.000 người dùng hoạt động mỗi tháng\n- Giảm thời gian phản hồi trung bình từ 800ms xuống 250ms\n- Thiết lập CI/CD với Docker, rút ngắn thời gian triển khai 60%",sk:"Node.js, TypeScript, PostgreSQL, Redis, Docker, AWS, Git, Unit Test"},
fin:{n:"Tài chính – Kế toán",t:"classic",ac:"#1e293b",ff:"lora",title:"Kế toán tổng hợp",sum:"Kế toán tổng hợp 5 năm kinh nghiệm tại doanh nghiệp sản xuất, nắm vững chuẩn mực VAS, báo cáo thuế và kiểm soát nội bộ. Cẩn thận, chính xác, đúng hạn.",role:"Kế toán tổng hợp",org:"Công ty Cổ phần Sản xuất DEF",time:"2020 – nay",d:"- Lập báo cáo tài chính tháng, quý, năm cho 3 pháp nhân\n- Rút ngắn thời gian khóa sổ từ 10 xuống 6 ngày\n- Phối hợp kiểm toán độc lập, không phát sinh điều chỉnh trọng yếu",sk:"MISA, SAP, Excel nâng cao, Báo cáo thuế, VAS, Phân tích tài chính"},
med:{n:"Y tế – Dược",t:"minimal",ac:"#0e7490",ff:"bevn",title:"Điều dưỡng viên",sum:"Điều dưỡng viên 4 năm kinh nghiệm tại khoa Nội tổng hợp, chăm sóc bệnh nhân toàn diện, tuân thủ quy trình an toàn và giao tiếp tốt với người bệnh.",role:"Điều dưỡng viên",org:"Bệnh viện Đa khoa Khu vực",time:"2021 – nay",d:"- Chăm sóc 12–15 bệnh nhân mỗi ca theo phác đồ điều trị\n- Tham gia chương trình giảm nhiễm khuẩn bệnh viện, tỷ lệ tuân thủ rửa tay đạt 95%\n- Hướng dẫn thực hành cho 8 điều dưỡng mới",sk:"Chăm sóc bệnh nhân, Sơ cấp cứu, Quản lý hồ sơ bệnh án, Kiểm soát nhiễm khuẩn, Giao tiếp"},
edu:{n:"Giáo dục – Đào tạo",t:"classic",ac:"#4338ca",ff:"lora",title:"Giáo viên Tiếng Anh",sum:"Giáo viên Tiếng Anh 6 năm kinh nghiệm giảng dạy trung học, xây dựng bài giảng theo năng lực và ứng dụng công nghệ trong lớp học.",role:"Giáo viên Tiếng Anh",org:"Trường THPT Nguyễn Du",time:"2019 – nay",d:"- Giảng dạy 4 lớp, 160 học sinh, điểm trung bình tăng 1,2 điểm sau một năm\n- Bồi dưỡng đội tuyển học sinh giỏi đạt 5 giải cấp tỉnh\n- Xây dựng ngân hàng 600 câu hỏi kiểm tra",sk:"Thiết kế bài giảng, Quản lý lớp học, IELTS, Google Classroom, Đánh giá năng lực"},
des:{n:"Thiết kế – Sáng tạo",t:"sidebar",ac:"#be185d",ff:"bevn",title:"UI/UX Designer",sum:"Nhà thiết kế sản phẩm 4 năm kinh nghiệm, kết hợp nghiên cứu người dùng và thiết kế giao diện để cải thiện trải nghiệm ứng dụng di động.",role:"UI/UX Designer",org:"Studio Sáng Tạo",time:"2022 – nay",d:"- Thiết kế lại luồng thanh toán, tăng tỷ lệ hoàn tất đơn 18%\n- Xây dựng hệ thống thiết kế gồm 120 thành phần dùng chung\n- Thực hiện 20 buổi kiểm thử người dùng",sk:"Figma, Nghiên cứu người dùng, Prototype, Design System, Illustrator, HTML/CSS cơ bản"},
eng:{n:"Kỹ thuật – Sản xuất",t:"banner",ac:"#374151",ff:"arial",title:"Kỹ sư Cơ khí",sum:"Kỹ sư cơ khí 5 năm kinh nghiệm trong dây chuyền sản xuất, cải tiến năng suất theo Lean và đảm bảo an toàn lao động.",role:"Kỹ sư Sản xuất",org:"Công ty TNHH Cơ khí GHI",time:"2020 – nay",d:"- Cải tiến quy trình lắp ráp, tăng năng suất 22%\n- Giảm tỷ lệ phế phẩm từ 4% xuống 1,5%\n- Quản lý đội 25 công nhân, 0 tai nạn lao động trong 3 năm",sk:"AutoCAD, SolidWorks, Lean, 5S, Six Sigma, Bảo trì thiết bị, Quản lý sản xuất"}
};
const mk=(id,title,type,on,v)=>({id,title,type,on,v});
function fromInd(k){const i=IND[k];return{p:{name:"Nguyễn Văn An",title:i.title,email:"van.an@email.com",phone:"0901 234 567",addr:"Cần Thơ",link:"linkedin.com/in/vanan"},
secs:[mk("sum","Tóm tắt","text",1,i.sum),mk("exp","Kinh nghiệm làm việc","items",1,[{a:i.role,b:i.org,c:i.time,d:i.d}]),mk("edu","Học vấn","items",1,[{a:"Cử nhân – Chuyên ngành phù hợp",b:"Đại học Cần Thơ",c:"2016 – 2020",d:""}]),mk("sk","Kỹ năng","tags",1,i.sk),mk("proj","Dự án","items",0,[]),mk("cert","Chứng chỉ","items",0,[])]}}
let S=null;try{S=JSON.parse(localStorage.getItem("cv1")||"null")}catch(e){}
if(!S||!S.p)S=Object.assign(fromInd("biz"),{});
if(!S.d)S.d={tpl:"banner",ac:"#1d4ed8",ff:"bevn",fs:13.5,gap:16};
const DEFS=[["sum","Tóm tắt","text"],["exp","Kinh nghiệm làm việc","items"],["edu","Học vấn","items"],["sk","Kỹ năng","tags"],["lang","Ngoại ngữ","tags"],["proj","Dự án","items"],["cert","Chứng chỉ","items"],["act","Hoạt động","items"],["award","Giải thưởng","items"],["hob","Sở thích","text"],["ref","Người tham chiếu","text"]];
const SAMPLE='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320"><rect width="240" height="320" fill="#dbe4ee"/><circle cx="120" cy="120" r="52" fill="#9fb2c6"/><path d="M30 320c0-72 40-110 90-110s90 38 90 110z" fill="#9fb2c6"/></svg>');
DEFS.forEach(([id,t,ty])=>{if(!S.secs.find(s=>s.id===id))S.secs.push(mk(id,t,ty,0,ty==="items"?[]:""))});
if(!S.p.photo&&!S.p.nophoto)S.p.photo=SAMPLE;
let tab="c";
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function save(){try{localStorage.setItem("cv1",JSON.stringify(S))}catch(e){}}
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",4500)}
const has=s=>s.type==="items"?s.v.some(i=>i.a||i.b||i.d):!!String(s.v).trim();
function desc(d){if(!d)return"";const L=d.split("\n").filter(x=>x.trim());const li=L.filter(x=>/^\s*[-•*]/.test(x)),tx=L.filter(x=>!/^\s*[-•*]/.test(x));return(tx.length?`<p>${tx.map(esc).join("<br>")}</p>`:"")+(li.length?`<ul>${li.map(x=>`<li>${esc(x.replace(/^\s*[-•*]\s*/,""))}</li>`).join("")}</ul>`:"")}
function secHTML(s){let b;if(s.type==="items")b=s.v.filter(i=>i.a||i.b||i.d).map(i=>`<div class="it"><div class="m"><b>${esc(i.a)}</b>${i.b?`<div class="o">${esc(i.b)}</div>`:""}${desc(i.d)}</div><span class="t">${esc(i.c)}</span></div>`).join("");else b=`<p>${esc(s.v).replace(/\n/g,"<br>")}</p>`;return`<section><h2>${esc(s.title)}</h2>${b}</section>`}
function cvHTML(){const{p,secs,d}=S,vs=secs.filter(s=>s.on&&has(s));
const ct=[p.email,p.phone,p.addr,p.link].filter(Boolean),img=p.photo?`<img class="ph" src="${p.photo}" alt="Ảnh chân dung">`:"";
const style=`--ac:${d.ac};--ff:${FF[d.ff][1]};--fs:${d.fs}px;--lh:1.5;--gap:${d.gap}`;
if(d.tpl==="sidebar"){const side=vs.filter(s=>["sk","lang","edu","cert","hob"].includes(s.id)),main=vs.filter(s=>!side.includes(s));
return`<div class="cv sidebar" style="${style}"><aside>${img}<section style="margin-top:0"><h2>Liên hệ</h2><div class="ct">${ct.map(x=>`<span>${esc(x)}</span>`).join("")}</div></section>${side.map(secHTML).join("")}</aside><main><h1>${esc(p.name)}</h1><div class="ti">${esc(p.title)}</div>${main.map(secHTML).join("")}</main></div>`}
return`<div class="cv ${d.tpl}" style="${style}"><header class="${img?"hp":""}"><div><h1>${esc(p.name)}</h1><div class="ti">${esc(p.title)}</div><div class="ct">${ct.map(esc).join(" | ")}</div></div>${img}</header>${vs.map(secHTML).join("")}</div>`}
function draw(){$("#paper").innerHTML=cvHTML();fit();save()}
function fit(){const w=$("#stage").clientWidth-32;$("#paper").style.zoom=Math.min(1,Math.max(.3,w/794))}
addEventListener("resize",fit);
/* editor */
const TABS={c:"Nội dung",t:"Mẫu",d:"Thiết kế",a:"ATS",i:"Nhập CV"};
