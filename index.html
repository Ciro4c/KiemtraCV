<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trình tạo CV chuyên nghiệp</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Lora:wght@400;600;700&family=Inter:wght@400;600;700&display=swap">
<style>
:root{--bg:#f3f4f6;--pn:#fff;--tx:#111827;--mu:#6b7280;--bd:#e5e7eb;--br:#0f766e;--brt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--pn:#1a1d23;--tx:#e5e7eb;--mu:#9ca3af;--bd:#2d323b;--br:#2dd4bf;--brt:#042f2e}}
:root[data-theme="dark"]{--bg:#0f1115;--pn:#1a1d23;--tx:#e5e7eb;--mu:#9ca3af;--bd:#2d323b;--br:#2dd4bf;--brt:#042f2e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Be Vietnam Pro",Arial,sans-serif}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--pn);border-bottom:1px solid var(--bd)}
.top h1{font-size:16px;margin:0 auto 0 0}
button,select,input,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--bd);background:var(--pn);border-radius:8px;padding:6px 11px;cursor:pointer}
.btn:hover{border-color:var(--br)}.btn.p{background:var(--br);color:var(--brt);border-color:var(--br);font-weight:600}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--br);outline-offset:1px}
.app{display:grid;grid-template-columns:minmax(340px,430px) 1fr;gap:0;align-items:start}
.ui{border-right:1px solid var(--bd);background:var(--pn);min-height:calc(100vh - 56px)}
.tabs{display:flex;border-bottom:1px solid var(--bd);position:sticky;top:calc(env(safe-area-inset-top,0px) + 55px);background:var(--pn);z-index:4}
.tabs button{flex:1;padding:10px 4px;border:0;background:none;cursor:pointer;color:var(--mu);border-bottom:2px solid transparent}
.tabs button.on{color:var(--tx);font-weight:600;border-color:var(--br)}
.pane{padding:14px}
.f{display:grid;gap:8px}.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,textarea,select{width:100%;padding:7px 9px;border:1px solid var(--bd);border-radius:7px;background:var(--bg)}
textarea{resize:vertical;min-height:70px}
.card{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px}
.hd{display:flex;gap:6px;align-items:center;margin-bottom:8px}.hd input{font-weight:600}
.sm{padding:3px 8px;font-size:12px}
.sub{border-top:1px dashed var(--bd);padding-top:8px;margin-top:8px}
h3{font-size:13px;margin:14px 0 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{text-align:left;border:1px solid var(--bd);background:var(--bg);border-radius:9px;padding:9px;cursor:pointer}
.opt.on{border-color:var(--br);box-shadow:0 0 0 1px var(--br)}.opt b{display:block}.opt small{color:var(--mu)}
.sw{display:flex;flex-wrap:wrap;gap:7px}.sw button{width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);cursor:pointer}.sw button.on{border-color:var(--tx)}
.ck{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.score{font-size:30px;font-weight:700}
.stage{padding:16px;overflow:auto;height:calc(100vh - 56px);position:sticky;top:56px}
#paper{width:794px;margin:0 auto;box-shadow:0 2px 14px rgba(0,0,0,.22);transform-origin:top center}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:9px;max-width:90vw;z-index:9;display:none}
/* CV */
.cv{background:#fff;color:#1f2937;width:794px;min-height:1122px;padding:48px 52px;font:var(--fs)/var(--lh) var(--ff);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cv h1{font-size:2.1em;margin:0;line-height:1.15;color:#111}
.cv .ti{font-size:1.1em;color:var(--ac);margin-top:4px;font-weight:600}
.cv .ct{margin-top:8px;font-size:.92em;color:#4b5563}
.cv section{margin-top:calc(var(--gap)*1px)}
.cv h2{font-size:1.05em;margin:0 0 6px;font-weight:700;color:#111}
.cv p{margin:0}.cv ul{margin:4px 0 0;padding-left:18px}.cv li{margin:1px 0}
.cv .it{margin-bottom:9px}.cv .r{display:flex;justify-content:space-between;gap:12px}
.cv .r span{color:#6b7280;white-space:nowrap;font-size:.92em}.cv .o{color:#4b5563}
.cv.classic header{text-align:center}.cv.classic h2{border-bottom:1.5px solid var(--ac);padding-bottom:3px}
.cv.banner header{background:var(--ac);margin:-48px -52px 0;padding:38px 52px}
.cv.banner h1,.cv.banner .ti,.cv.banner .ct{color:#fff}.cv.banner h2{color:var(--ac);border-bottom:1px solid #e5e7eb;padding-bottom:3px}
.cv.minimal h2{color:var(--ac);border-left:3px solid var(--ac);padding-left:8px}
.cv.sidebar{display:grid;grid-template-columns:230px 1fr;padding:0}
.cv.sidebar aside{background:var(--ac);color:#fff;padding:44px 22px}
.cv.sidebar aside h2,.cv.sidebar aside .o,.cv.sidebar aside .r span{color:#fff}
.cv.sidebar aside h2{border-bottom:1px solid rgba(255,255,255,.45);padding-bottom:3px}
.cv.sidebar aside .ct{color:#fff;display:grid;gap:3px;word-break:break-word}
.cv.sidebar aside .r{display:block}
.cv.sidebar main{padding:46px 36px}
@media (max-width:860px){.app{grid-template-columns:1fr}.ui{min-height:0;border-right:0}.stage{height:auto;position:static}.tabs{top:calc(env(safe-area-inset-top,0px) + 55px)}}
@media print{.top,.ui,.toast{display:none!important}body,.stage{background:#fff;padding:0!important;height:auto!important;overflow:visible!important;position:static!important}.app{display:block}#paper{zoom:1!important;box-shadow:none!important;margin:0}@page{size:A4;margin:0}}
#paper{position:relative}
#paper::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0 1120px,rgba(220,38,38,.55) 1120px 1122px)}
.cv{--u:4px;padding:calc(var(--u)*12) calc(var(--u)*13);line-height:1.5}
.cv h1{font-size:1.95em;line-height:1.15;letter-spacing:-.01em}
.cv .ti{font-size:1.25em;line-height:1.3;margin-top:var(--u)}
.cv .ct{font-size:.875em;margin-top:calc(var(--u)*3)}
.cv h2{font-size:1.125em;line-height:1.3;margin:0 0 calc(var(--u)*2.5);break-after:avoid}
.cv p{orphans:2;widows:2}.cv ul{margin:var(--u) 0 0;padding-left:1.2em}.cv .o{font-weight:600}
.cv .it{display:grid;grid-template-columns:7.5em 1fr;column-gap:calc(var(--u)*4);margin-bottom:calc(var(--u)*3);break-inside:avoid}
.cv .it .t{grid-column:1;grid-row:1;color:#6b7280;font-size:.875em;line-height:1.7}
.cv .it .m{grid-column:2;grid-row:1;min-width:0}
.cv header.hp{display:flex;justify-content:space-between;align-items:center;gap:calc(var(--u)*6)}
.cv.classic header.hp{text-align:left}
.cv .ph{width:105px;height:140px;object-fit:cover;border-radius:4px;flex:none}
.cv.banner .ph{border:2px solid #fff}
.cv.sidebar aside .it{display:flex;flex-direction:column}
.cv.sidebar aside .t{order:-1;color:#fff;opacity:.85}
.cv.sidebar aside .ph{display:block;width:150px;height:200px;margin:0 auto calc(var(--u)*5)}
@media print{@page{size:A4;margin:0}#paper::after{display:none}}
.tabs{overflow-x:auto}.tabs button{white-space:nowrap;padding:10px 10px}
:root{--r:12px}
body{font-size:14px;line-height:1.5}
.top{padding:10px 16px;gap:10px;align-items:center}
.top h1{font-size:17px;margin:0;display:flex;align-items:center;gap:9px}
.top h1::before{content:"";width:22px;height:22px;border-radius:7px;background:var(--br)}
.btn{border-radius:9px;padding:7px 13px}.btn.sm{padding:5px 10px;font-size:13px}
.btn.p{background:var(--br);color:var(--brt);border-color:var(--br);font-weight:600}
.menu{position:absolute;right:16px;top:100%;margin-top:6px;min-width:300px;background:var(--pn);border:1px solid var(--bd);border-radius:var(--r);box-shadow:0 14px 34px rgba(0,0,0,.2);padding:6px;z-index:30}
.menu[hidden]{display:none}
.menu .mh{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);padding:9px 10px 4px}
.menu button,.menu label{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:9px 10px;border:0;background:none;border-radius:8px;cursor:pointer;line-height:1.35}
.menu button:hover,.menu label:hover{background:var(--bg)}
.menu small{color:var(--mu);font-size:12px}
.app{grid-template-columns:minmax(380px,450px) 1fr;align-items:start}
.ui{background:var(--bg);border-right:1px solid var(--bd)}
.tabs{background:var(--pn);padding:0 6px;top:57px;overflow:visible}
.tabs button{padding:13px 4px;font-weight:500;font-size:13px;white-space:nowrap}
.pane{padding:14px}
.fl{display:grid;gap:4px;font-size:12px;color:var(--mu);font-weight:500}
.fl input,.fl textarea,.fl select{font-size:14px;color:var(--tx);font-weight:400;background:var(--pn)}
.fl textarea{min-height:84px}
[data-a='letter'],[data-a='letterEn']{min-height:290px!important}
.rf{color:var(--br);font-weight:400}
.mu{color:var(--mu)}small.mu,small.rf{font-size:12px}
.sec{border:1px solid var(--bd);border-radius:var(--r);margin-bottom:10px;background:var(--pn)}
.sec>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:9px;font-weight:600;border-radius:var(--r)}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{content:'▾';margin-left:auto;color:var(--mu);font-size:12px}
.sec[open]>summary::after{content:'▴'}
.sec[open]>summary{border-bottom:1px solid var(--bd);border-bottom-left-radius:0;border-bottom-right-radius:0}
.sec .bd{padding:12px 14px 14px;display:grid;gap:12px}
.sc{display:inline-flex;gap:5px;align-items:center;margin-left:auto;font-weight:400}
.sec>summary:has(.sc)::after{margin-left:0}
.sw2{display:inline-flex;gap:4px;align-items:center;font-size:12px;color:var(--mu);cursor:pointer}.sw2 input{width:auto}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bd);flex:none}.dot.on{background:#16a34a}
.it2{border:1px dashed var(--bd);border-radius:10px;padding:10px;display:grid;gap:10px}
.lb{font-size:12px;color:var(--mu);display:block;margin-bottom:6px}
.dc{border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;display:grid;gap:8px;background:var(--pn)}
.dh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip{font-size:11px;padding:2px 9px;border-radius:99px;font-weight:600}
.chip.ok{background:rgba(22,163,74,.16);color:#16a34a}.chip.no{background:rgba(217,119,6,.16);color:#d97706}
.pv{position:sticky;top:57px;height:calc(100vh - 57px);display:flex;flex-direction:column;min-width:0}
.pvt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--bd);background:var(--pn)}
.pvt select{width:auto;padding:5px 8px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:9px;overflow:hidden;background:var(--pn)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--br);color:var(--brt);font-weight:600}
.stage{flex:1;height:auto;position:static;overflow:auto;padding:18px 16px;background:var(--bg)}
#mseg{display:none}
.gauge{width:108px;height:108px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--v)*1%),var(--bd) 0);display:grid;place-items:center;position:relative;margin:4px auto 10px}
.gauge::before{content:'';position:absolute;inset:10px;background:var(--bg);border-radius:50%}
.gauge b{position:relative;font-size:30px;line-height:1}.gauge small{position:relative;color:var(--mu);margin-top:-30px}
.opt{cursor:default}
table.gl{width:100%;border-collapse:collapse;font-size:12px}.gl td,.gl th{border-bottom:1px solid var(--bd);padding:4px 6px;text-align:left}
.dpaper{background:#fff;color:#111;width:794px;min-height:1122px;padding:76px 57px 76px 113px;font-family:'Times New Roman',Times,serif;font-size:13pt;line-height:1.5;box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.dpaper.txt{font-family:Arial,sans-serif;font-size:11pt;padding:60px 70px}.dpaper pre{white-space:pre-wrap;font:inherit;margin:0}
@media (max-width:860px){.top{flex-wrap:nowrap;gap:8px;padding:10px 10px}.top h1{font-size:15px;white-space:nowrap}.top h1::before{display:none}.app{display:block}.app[data-m='e'] .pv{display:none}.app[data-m='v'] .ui{display:none}.pv{position:static;height:auto;min-height:70vh}.stage{padding:10px 6px}#mseg{display:inline-flex}.tabs{top:57px}.menu{right:8px;left:8px;min-width:0}}
@media print{.pvt{display:none!important}.menu{display:none!important}.pv{display:block!important;height:auto!important;position:static!important}.app{display:block!important}.stage{padding:0!important;background:#fff!important}}
</style>
<style id="pgst"></style>

<body>
<div class="top">
  <h1>Trình tạo CV</h1>
  <div class="seg" id="mseg"><button data-m="e" class="on">Soạn</button><button data-m="v">Xem CV</button></div>
  <span style="flex:1"></span>
  <button class="btn p" data-x="menu" aria-haspopup="true">Tải xuống ▾</button>
  <div class="menu" id="dm" hidden>
    <div class="mh">Tải CV</div>
    <button data-x="pdf"><span>PDF chữ thật<br><small>ATS đọc được, nên dùng khi nộp online</small></span></button>
    <button data-x="docx"><span>Word (.docx)<br><small>Dễ chỉnh sửa, ATS đọc tốt</small></span></button>
    <button data-x="imgpdf"><span>PDF ảnh (màu)<br><small>Như bản in, ATS không đọc được chữ</small></span></button>
    <button data-x="imgpdfbw"><span>PDF ảnh quét (đen trắng)<br><small>Giống bản scan, ATS không đọc được chữ</small></span></button>
    <button data-x="html"><span>Trang HTML</span></button>
    <button data-x="txt"><span>Văn bản thuần (.txt)<br><small>Để dán vào ô nhập trên web tuyển dụng</small></span></button>
    <div class="mh">Dữ liệu</div>
    <button data-x="json"><span>Lưu dữ liệu (.json)</span></button>
    <label><span>Mở dữ liệu (.json)</span><input type="file" id="imp" accept=".json" hidden></label>
  </div>
</div>
<div class="app" data-m="e">

</div>

document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const D=b.dataset;

if(D.x==="menu"){const m=$("#dm");m.hidden=!m.hidden;return}if(D.x){$("#dm").hidden=true;exp(D.x);return}
if(D.act){const i=+D.i,j=+D.j,a=D.act,s=S.secs;
if(a==="up"&&i>0)[s[i-1],s[i]]=[s[i],s[i-1]];

draw();drawPane()}});

function txt(){const{p,secs}=S;let o=[p.name,p.title,[p.email,p.phone,p.addr,p.link].filter(Boolean).join(" | "),""];secs.filter(s=>s.on&&has(s)).forEach(s=>{o.push(s.title.toUpperCase());if(s.type==="items")s.v.filter(i=>i.a||i.b).forEach(i=>{o.push([i.a,i.b,i.c].filter(Boolean).join(" | "));if(i.d)o.push(i.d);o.push("")});else o.push(s.v,"");o.push("")});return o.join("\n").replace(/\n{3,}/g,"\n\n")}

async function exp(k){const name=slug(S.p.name||"CV")+(S.lang==="en"?"_Resume":"_CV");

let files;try{files=k==="docx"?[name+".docx",await docxBlob()]:{html:[name+".html",htmlDoc()],txt:[name+".txt",txt()],json:[name+".json",JSON.stringify(S)]}[k]}catch(e){toast("Không tạo được file Word, hãy dùng Tải PDF.");return}
let d=null;try{d=window.claude&&await claude.use("downloads")}catch(e){}
